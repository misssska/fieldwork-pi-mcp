name: M15J4 disposable three-service Compose build HTTP PostgreSQL smoke (not Pi)
on:
  push:
    branches: [feat/artifact-inbox-no-manual-copy-20261030]
    paths:
      - updater/m15j_disposable_compose_stage.py
      - tests/test_m15j_disposable_compose_stage.py
      - .github/workflows/m15j4-disposable-compose-stage.yml
  pull_request:
    paths:
      - updater/m15j_disposable_compose_stage.py
      - tests/test_m15j_disposable_compose_stage.py
      - .github/workflows/m15j4-disposable-compose-stage.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m15j4-compose-fixture-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-stage:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Fixed stage contract and rollback negative tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q updater/m15j_disposable_compose_stage.py
          python3 -m unittest discover -s tests -p 'test_m15j_disposable_compose_stage.py' -v
      - name: Real 3-service Docker Compose build/up/HTTP/SQL/down
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          docker compose version
          docker pull nginx:1.27-alpine
          docker pull postgres:16-alpine
          export NGINX_IMAGE=$(docker image inspect nginx:1.27-alpine --format '{{index .RepoDigests 0}}')
          export POSTGRES_IMAGE=$(docker image inspect postgres:16-alpine --format '{{index .RepoDigests 0}}')
          python3 - <<'PY'
          import os,secrets
          from updater import m15j_disposable_compose_stage as s
          result=s.run_fixed_stage(
              run_id=secrets.token_hex(16),
              nginx_image=os.environ["NGINX_IMAGE"],
              pg_image=os.environ["POSTGRES_IMAGE"],
              source_locally_trusted=True,
              ci_disposable_host=True)
          assert result["status"]=="M15J4_NATIVE_COMPOSE_BUILD_UP_HTTP_SQL_DOWN_PASS"
          assert result["image_build_verified"] is True
          assert result["http_proxy_verified"] is True
          assert result["postgres_sql_verified"] is True
          assert result["compose_resources_cleaned"] is True
          assert result["host_ports_published"] is False
          assert result["real_fieldwork_stage_release_parity"] is False
          assert result["mcp_36_tool_parity"] is False
          assert result["cutover_authorized"] is False
          print("M15J4_REAL_3_SERVICE_COMPOSE_BUILD_HTTP_SQL_CLEANUP_PASS")
          PY
          test -z "$(docker container ls -aq --filter name=fieldwork-m15jstage-)"
          test -z "$(docker network ls -q --filter name=fieldwork-m15jstage-)"
          echo M15J4_COMPOSE_NO_CONTAINERS_OR_NETWORKS_LEFT_PASS

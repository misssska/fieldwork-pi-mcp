name: FieldWork private source snapshot exporter – native contract
on:
  push:
    branches: [feat/artifact-inbox-no-manual-copy-20261030]
    paths:
      - updater/fieldwork_private_source_snapshot.py
      - tests/test_fieldwork_private_source_snapshot.py
      - .github/workflows/fieldwork-private-snapshot-exporter.yml
  pull_request:
    paths:
      - updater/fieldwork_private_source_snapshot.py
      - tests/test_fieldwork_private_source_snapshot.py
      - .github/workflows/fieldwork-private-snapshot-exporter.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fieldwork-private-snapshot-${{ github.ref }}
  cancel-in-progress: true
jobs:
  read-only-source-snapshot:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exact exported Python source SHA256
        shell: bash
        run: |
          set -euo pipefail
          echo '924d51d7538c62c7efdf2d4ad6fb3e02d7e215ca1a194c02e431f140a48bd10a  updater/fieldwork_private_source_snapshot.py' | sha256sum --check
      - name: Full snapshot read-only positive and negative contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_fieldwork_private_source_snapshot.py' -v > "$RUNNER_TEMP/snapshot-tests.log" 2>&1 || {
            tail -n 100 "$RUNNER_TEMP/snapshot-tests.log"
            exit 1
          }
          tail -n 20 "$RUNNER_TEMP/snapshot-tests.log"
          grep -Eq 'Ran 15 tests in [0-9.]+' "$RUNNER_TEMP/snapshot-tests.log"
          grep -q '^OK$' "$RUNNER_TEMP/snapshot-tests.log"
          echo FIELDWORK_PRIVATE_SOURCE_EXPORTER_15_TESTS_NATIVE_PASS

name: M15B inactive root-owned host bootstrap acceptance (disposable runners)
on:
  push:
    branches: [feat/artifact-inbox-no-manual-copy-20261030]
    paths:
      - updater/m15_*.py
      - tests/test_m15_*.py
      - deploy/systemd/**
      - .github/workflows/m15b-inactive-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: m15b-inactive-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-host:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Preflight and package offline candidate as unprivileged user
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          test ! -e /opt/linux-mcp-operator
          python3 -m unittest discover -s tests -p 'test_m15_*.py' -v
          python3 -m updater.m15_portable_bundle \
            --source-root "$GITHUB_WORKSPACE" --commit "$GITHUB_SHA" \
            --out "$RUNNER_TEMP/m15b-candidate.tar.gz"
          python3 - <<'PY'
          import os
          from pathlib import Path
          from updater import m15_inactive_bootstrap as m
          from updater import m15_portable_bundle as b
          raw = Path(os.environ["RUNNER_TEMP"] + "/m15b-candidate.tar.gz").read_bytes()
          report = m.verify_only(raw, trusted_sha=b.sha(raw),
                                 trusted_commit=os.environ["GITHUB_SHA"])
          assert report["installation_performed"] is False
          assert report["status"] == "M15B_INACTIVE_BOOTSTRAP_PREFLIGHT_PASS"
          print("M15B_UNPRIVILEGED_INACTIVE_PREFLIGHT_PASS")
          PY
      - name: Inactive root-owned install, foreign-file denial and exact rollback
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /opt/linux-mcp-operator
          # This is an ephemeral GitHub runner only. sudo here is not an
          # approval mechanism for a real Pi and no unit is registered.
          sudo env M15B_COMMIT="$GITHUB_SHA" \
            M15B_ARCHIVE="$RUNNER_TEMP/m15b-candidate.tar.gz" \
            python3 -s - <<'PY'
          import os
          from pathlib import Path
          from updater import m15_inactive_bootstrap as m
          from updater import m15_portable_bundle as b
          raw=Path(os.environ["M15B_ARCHIVE"]).read_bytes()
          digest=b.sha(raw)
          commit=os.environ["M15B_COMMIT"]
          result=m.install_inactive(
              raw,trusted_sha=digest,trusted_commit=commit,
              local_admin_approval=True)
          assert result["status"]=="M15B_INSTALLED_INACTIVE"
          assert result["service_enabled"] is False
          assert result["update_capability_enabled"] is False
          target=Path("/opt/linux-mcp-operator")
          assert target.is_dir()
          assert (target/".complete.json").is_file()
          assert (target/"manifest.json").is_file()
          assert not Path("/etc/systemd/system/linux-mcp-operator.service").exists()
          assert not Path("/run/linux-mcp-docker-proxy.sock").exists()
          print("M15B_REAL_ROOT_OWNED_INACTIVE_INSTALL_PASS")
          try:
              m.rollback_inactive(
                  trusted_sha="0"*64,trusted_commit=commit,
                  local_admin_approval=True)
          except m.BootstrapDenied:
              pass
          else:
              raise AssertionError("wrong SHA rollback accepted")
          assert target.is_dir()
          (target/"foreign.txt").write_text("DO NOT DELETE")
          try:
              m.rollback_inactive(
                  trusted_sha=digest,trusted_commit=commit,
                  local_admin_approval=True)
          except m.BootstrapDenied:
              pass
          else:
              raise AssertionError("foreign file delete accepted")
          assert (target/"foreign.txt").read_text()=="DO NOT DELETE"
          (target/"foreign.txt").unlink()
          done=m.rollback_inactive(
              trusted_sha=digest,trusted_commit=commit,
              local_admin_approval=True)
          assert done["status"]=="M15B_INACTIVE_BOOTSTRAP_ROLLED_BACK"
          assert not target.exists()
          print("M15B_EXACT_ROLLBACK_NO_FOREIGN_FILE_PASS")
          print("M15B_NO_SYSTEMD_DOCKER_PRODUCTION_MCP_CHANGE")
          PY

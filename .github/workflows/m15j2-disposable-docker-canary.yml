name: M15J2 disposable isolated Docker canary lifecycle (not Pi)
on:
  push:
    branches: [feat/artifact-inbox-no-manual-copy-20261030]
    paths:
      - updater/m15j_disposable_docker_canary.py
      - tests/test_m15j_disposable_docker_canary.py
      - .github/workflows/m15j2-disposable-docker-canary.yml
  pull_request:
    paths:
      - updater/m15j_disposable_docker_canary.py
      - tests/test_m15j_disposable_docker_canary.py
      - .github/workflows/m15j2-disposable-docker-canary.yml
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: m15j2-docker-canary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-container:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Negative unit and syntax contracts (no Docker invoked)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_m15j_disposable_docker_canary.py' -v
          python3 -m compileall -q updater/m15j_disposable_docker_canary.py
      - name: Real disposable Docker container exact create-start-wait-delete
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          docker info --format '{{.ServerVersion}}'
          docker pull alpine:3.20
          CANARY_IMAGE=$(docker image inspect alpine:3.20 --format '{{index .RepoDigests 0}}')
          export CANARY_IMAGE
          python3 - <<'PY'
          import os,secrets
          from updater import m15j_disposable_docker_canary as c
          actual=c.run_canary(
              run_id=secrets.token_hex(16),
              trusted_image=os.environ["CANARY_IMAGE"],
              source_locally_trusted=True,
              ci_disposable_host=True)
          assert actual["status"]=="M15J_CI_ONLY_ISOLATED_DOCKER_LIFECYCLE_PASS"
          assert actual["container_removed"] is True
          assert actual["host_mount_used"] is False
          assert actual["network_created"] is False
          assert actual["database_created"] is False
          assert actual["cutover_authorized"] is False
          print("M15J2_NATIVE_REAL_DOCKER_CANARY_CREATE_START_WAIT_DELETE_PASS")
          print("M15J2_NO_REAL_PI_NO_HOST_MOUNTS_NO_PRODUCTION_CHANGE")
          PY
          test -z "$(docker ps -aq --filter name=fieldwork-m15j-canary-)"
          echo M15J2_NO_CANARY_CONTAINERS_LEFT_PASS

name: M14 Linux MCP update gate portable native security tests
on:
  push:
    branches: [feat/artifact-inbox-no-manual-copy-20261030]
    paths:
      - updater/linux_upgrade_gate.py
      - updater/linux_upgrade_inbox.py
      - updater/linux_upgrade_local_transaction.py
      - updater/linux_upgrade_review_ui.py
      - updater/linux_upgrade_local_handoff.py
      - updater/linux_upgrade_trust_gate.py
      - updater/linux_upgrade_operator_app.py
      - updater/linux_docker_read_proxy.py
      - updater/linux_docker_read_proxy_client.py
      - updater/linux_docker_read_proxy_service.py
      - updater/linux_stage_existing_lifecycle.py
      - updater/linux_stage_compose_contract.py
      - deploy/systemd/linux-mcp-docker-proxy.socket
      - deploy/systemd/linux-mcp-docker-proxy.service
      - deploy/systemd/linux-mcp-operator.service
      - tests/test_linux_upgrade_gate.py
      - tests/test_linux_upgrade_inbox.py
      - tests/test_linux_upgrade_local_transaction.py
      - tests/test_linux_upgrade_review_ui.py
      - tests/test_linux_upgrade_local_handoff.py
      - tests/test_linux_upgrade_trust_gate.py
      - tests/test_linux_upgrade_operator_app.py
      - tests/test_linux_upgrade_systemd_unit.py
      - tests/test_linux_docker_read_proxy.py
      - tests/test_linux_docker_proxy_service.py
      - tests/test_linux_stage_existing_lifecycle.py
      - tests/test_linux_stage_compose_contract.py
      - .github/workflows/m14-linux-update-gate.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m14-update-gate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host-gates:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run local-only release security and recovery tests
        shell: bash
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          python3 -m unittest discover -s tests -p 'test_linux_upgrade_*.py' -v
          python3 -m unittest discover -s tests -p 'test_linux_docker_*.py' -v
          python3 -m unittest discover -s tests -p 'test_linux_stage_*.py' -v
          python3 -m compileall -q updater/linux_upgrade_gate.py updater/linux_upgrade_inbox.py updater/linux_upgrade_local_transaction.py updater/linux_upgrade_review_ui.py updater/linux_upgrade_local_handoff.py updater/linux_upgrade_trust_gate.py updater/linux_upgrade_operator_app.py updater/linux_docker_read_proxy.py updater/linux_docker_read_proxy_client.py updater/linux_docker_read_proxy_service.py updater/linux_stage_existing_lifecycle.py updater/linux_stage_compose_contract.py
          echo "M14_OFFLINE_APPROVAL_AND_RECOVERY_PASS"
          echo "M14_NO_PI_DEPLOYMENT_OR_MCP_TOOL_REGISTRATION"

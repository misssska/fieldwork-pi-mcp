name: M15H pinned no-ZIP inactive host bootstrap (disposable CI only)
on:
  push:
    branches: [feat/artifact-inbox-no-manual-copy-20261030]
    paths:
      - updater/m15h_pinned_nozip_bootstrap.py
      - updater/m15_inactive_bootstrap.py
      - updater/m15_portable_bundle.py
      - tests/test_m15h_pinned_nozip_bootstrap.py
      - .github/workflows/m15h-nozip-inactive-bootstrap.yml
  pull_request:
    paths:
      - updater/m15h_pinned_nozip_bootstrap.py
      - updater/m15_inactive_bootstrap.py
      - updater/m15_portable_bundle.py
      - tests/test_m15h_pinned_nozip_bootstrap.py
      - .github/workflows/m15h-nozip-inactive-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m15h-verified-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight-and-real-inactive-install:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Negative contracts and byte-identical offline source reconstruction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_m15h_pinned_nozip_bootstrap.py' -v
          python3 -m compileall -q updater/m15h_pinned_nozip_bootstrap.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          from updater import m15_portable_bundle as b
          from updater import m15h_pinned_nozip_bootstrap as h
          commit=os.environ["GITHUB_SHA"]
          files=b.collect(Path(os.environ["GITHUB_WORKSPACE"]))
          archive=b.make_archive(files,source_commit=commit)
          sha=b.sha(archive)
          report=h.run(mode="check",commit=commit,trusted_sha256=sha,
                       source_reader=lambda _commit,p:files[p])
          assert report["status"]=="M15H_PINNED_ARCHIVE_VERIFIED_NOT_INSTALLED"
          assert report["installation_performed"] is False
          assert report["publisher_identity_verified"] is False
          print("M15H_PINNED_NOZIP_OFFLINE_RECONSTRUCTION_PASS")
          print("M15H_TEST_ARCHIVE_SHA256="+sha)
          PY
      - name: Retrieve real GitHub commit files with fixed URL and verify offline archive SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          from updater import m15_portable_bundle as bundle
          from updater import m15h_pinned_nozip_bootstrap as h
          commit=os.environ["GITHUB_SHA"]
          files=bundle.collect(Path(os.environ["GITHUB_WORKSPACE"]))
          expected=bundle.make_archive(files,source_commit=commit)
          original_sha=bundle.sha(expected)
          fetched=h.acquire_verified_archive(
              commit=commit,trusted_sha256=original_sha)
          assert fetched == expected
          print("M15H_REAL_PINNED_GITHUB_NOZIP_HTTPS_FETCH_PASS")
          PY
      - name: Only disposable runner root-owned inactive install and exact rollback
        shell: bash
        run: |
          set -euo pipefail
          test ! -e /opt/linux-mcp-operator
          sudo chown root:root /opt
          sudo chmod go-w /opt
          sudo env GITHUB_SHA="$GITHUB_SHA" GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            /usr/bin/python3 -s - <<'PY'
          import os
          from pathlib import Path
          from updater import m15_portable_bundle as b
          from updater import m15h_pinned_nozip_bootstrap as h
          commit=os.environ["GITHUB_SHA"]
          files=b.collect(Path(os.environ["GITHUB_WORKSPACE"]))
          sha=b.sha(b.make_archive(files,source_commit=commit))
          reader=lambda _commit,p:files[p]
          try:
              h.run(mode="install-inactive",commit=commit,
                    trusted_sha256="f"*64,local_admin_approval=True,
                    source_reader=reader)
          except h.PinnedBootstrapDenied:
              pass
          else:
              raise AssertionError("tampered external trust pin accepted")
          assert not Path("/opt/linux-mcp-operator").exists()
          got=h.run(mode="install-inactive",commit=commit,
                    trusted_sha256=sha,local_admin_approval=True,
                    source_reader=reader)
          assert got["status"]=="M15H_INACTIVE_SOURCE_INSTALLED_ONLY"
          assert got["privilege_boundary_verified"] is False
          assert got["services_started"] is False
          target=Path("/opt/linux-mcp-operator")
          installed=(target/"linux_approval_redeemer.py").read_bytes()
          assert installed==files["updater/linux_approval_redeemer.py"]
          assert (target/"linux_approval_redeemer.py").stat().st_uid==0
          assert not Path("/etc/systemd/system/linux-mcp-operator.service").exists()
          print("M15H_REAL_INACTIVE_M15E_SOURCE_INSTALL_PASS")
          try:
              h.run(mode="rollback-inactive",commit=commit,
                    trusted_sha256="e"*64,local_admin_approval=True)
          except Exception:
              pass
          else:
              raise AssertionError("rollback accepted wrong external pin")
          assert target.is_dir()
          done=h.run(mode="rollback-inactive",commit=commit,
                     trusted_sha256=sha,local_admin_approval=True)
          assert done["status"]=="M15B_INACTIVE_BOOTSTRAP_ROLLED_BACK"
          assert not target.exists()
          print("M15H_ROOT_INSTALL_AND_EXACT_ROLLBACK_PASS")
          print("M15H_NO_LIVE_PI_NO_SYSTEMD_NO_DOCKER_CHANGE")
          PY

name: MCP updater security tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run offline updater tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Run offline bootstrap tests
        run: PYTHONPATH=bootstrap python -m unittest discover -s bootstrap/tests -p 'test_*.py' -v
      - name: Compile updater, bootstrap and experimental candidates
        run: python -m compileall -q updater bootstrap experimental
      - name: Print immutable activation bootstrap SHA256
        run: sha256sum updater/activate_once.py
      - name: Print SHA256 of reviewed local artifact extension v2
        run: sha256sum updater/activate_artifact_extension_v2.py
